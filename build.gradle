// Java 参考实现，源码在 java/；Gradle 工程留在仓库根目录，JitPack 从根目录构建
plugins {
    id 'java-library'
    id 'maven-publish'
}

version = '3.1.0'

repositories {
    mavenCentral()
}

// 回归测试见 java/test.sh
sourceSets {
    main {
        java {
            srcDirs = ['java/src']
        }
    }
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    // 编译为 Java 8 字节码，兼容老项目
    options.release = 8
    // 源码含中文注释，显式指定编码，避免在非 UTF-8 环境下按平台默认编码解析
    options.encoding = 'UTF-8'
}

// 通过 JitPack 发布：com.github.venshine:PwScore:<tag>
publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.github.venshine'
            artifactId = 'PwScore'
            version = project.version
            from components.java
        }
    }
}
