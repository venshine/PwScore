name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# 每种语言一个 job，都跑同一份 spec/score-snapshot.tsv；本地等价命令见 ./test.sh
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./test.sh java
      - run: ./gradlew build

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./test.sh kotlin
      # 算法全在 commonMain，再确认 JS 和 Native 目标能编译
      - run: ./gradlew -p kotlin compileKotlinJs compileKotlinLinuxX64

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./test.sh swift objc

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: ./test.sh dart

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: ./test.sh js

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: ./test.sh python

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: ./test.sh go

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./test.sh rust

  c-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./test.sh c cpp

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: ./test.sh csharp

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - run: ./test.sh ruby

  perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./test.sh perl
